<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexCRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* First-paint splash — shown instantly before the JS bundle mounts, so the
         initial load never flashes a blank white screen. React replaces #root
         on mount, which removes it. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f4f6fa;
        font-family: Manrope, system-ui, -apple-system, sans-serif;
      }
      #app-splash .app-splash__chip {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #f59e0b;
        color: #1a1205;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 24px;
        box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
      }
      #app-splash .app-splash__spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(14, 22, 38, 0.15);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: app-splash-spin 0.7s linear infinite;
      }
      @keyframes app-splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .app-splash__spinner { animation-duration: 1.6s; }
      }
      @media (prefers-color-scheme: dark) {
        #app-splash { background: #0e1626; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="app-splash__chip">F</div>
        <div class="app-splash__spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
