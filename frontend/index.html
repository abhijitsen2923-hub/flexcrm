<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexCRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* First-paint splash — shown instantly before the JS bundle mounts, so the
         initial load never flashes a blank white screen. Matches the React
         branded loader (.brand-loader) exactly, so there's no visual jump when
         the bundle mounts. React replaces #root on mount, which removes it. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f5f6f8;
        font-family: Manrope, system-ui, -apple-system, sans-serif;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      #app-splash .as-chip {
        width: 60px;
        height: 60px;
        border-radius: 16px;
        background: linear-gradient(135deg, #f7b23b, #f59e0b);
        color: #1a1205;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 30px;
        box-shadow: 0 10px 26px rgba(245, 158, 11, 0.4);
        animation: as-breathe 2.4s ease-in-out infinite;
      }
      #app-splash .as-word {
        font-weight: 800;
        font-size: 1.35rem;
        letter-spacing: -0.01em;
        color: #16202e;
      }
      #app-splash .as-word span { color: #f59e0b; }
      #app-splash .as-track {
        width: 220px;
        max-width: 62vw;
        height: 6px;
        border-radius: 999px;
        background: rgba(138, 147, 162, 0.22);
        overflow: hidden;
      }
      #app-splash .as-fill {
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #f7b23b, #f59e0b);
        animation: as-slide 1.3s ease-in-out infinite;
      }
      @keyframes as-breathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.03); }
      }
      @keyframes as-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .as-chip { animation: none; }
        #app-splash .as-fill { animation: none; width: 100%; opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="as-chip">F</div>
        <div class="as-word">Flex<span>CRM</span></div>
        <div class="as-track"><div class="as-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
