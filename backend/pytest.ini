[pytest]
# Without `pythonpath`, a bare `pytest` from backend/ fails at collection with
# "ModuleNotFoundError: No module named 'app'": there is no conftest.py at the
# rootdir to put it on sys.path, so only `python -m pytest` (which adds the CWD)
# worked — while README documents the bare command.
pythonpath = .
testpaths = tests

# The suite uses explicit @pytest.mark.asyncio / @pytest_asyncio.fixture.
# Pinning the fixture loop scope also silences the pytest-asyncio 0.26
# DeprecationWarning emitted on every run.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
